<!DOCTYPE html><html><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Scan</title>
<style>
  :root{--bg:#0d1b0f;--panel:#132516;--acc:#7ee081;--acc2:#4caf50;--txt:#e8f5e9;--dim:#7d9a80;}
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  body{margin:0;font-family:ui-monospace,Menlo,Consolas,monospace;background:#0d1b0f;color:#e8f5e9;
       display:flex;flex-direction:column;height:100vh;overflow:hidden}
  header{padding:14px 16px;border-bottom:1px solid #1c3a20;display:flex;justify-content:space-between;align-items:center}
  h1{font-size:15px;margin:0;letter-spacing:2px;color:#7ee081;font-weight:600}
  #count{font-size:12px;color:#7d9a80}
  #reader{width:100%;background:#000;aspect-ratio:1/1;max-height:46vh;position:relative}
  #status{padding:10px 16px;font-size:13px;color:#7d9a80;min-height:20px}
  #manual{display:flex;gap:8px;padding:0 16px 10px}
  #manual input{flex:1;background:#0a140b;border:1px solid #1c3a20;color:#e8f5e9;padding:12px;
       border-radius:8px;font-family:inherit;font-size:16px}
  button{background:#1c3a20;color:#7ee081;border:1px solid #2c5a30;padding:12px 16px;border-radius:8px;
       font-family:inherit;font-size:14px;font-weight:600}
  button:active{background:#2c5a30}
  #log{flex:1;overflow-y:auto;padding:8px 16px;border-top:1px solid #1c3a20}
  .row{padding:8px 0;border-bottom:1px solid #142717;font-size:15px;letter-spacing:1px;
       display:flex;justify-content:space-between;animation:flash .5s}
  @keyframes flash{from{background:#1c3a20}to{background:transparent}}
  .row .n{color:#7d9a80;font-size:12px}
</style></head><body>
<header><h1>GNC SCAN</h1><span id="count">0 sent</span></header>
<div id="reader"></div>
<div id="status">Point camera at a barcode</div>
<div id="manual">
  <input id="mc" inputmode="numeric" placeholder="type UPC manually" />
  <button onclick="manual()">ADD</button>
</div>
<div id="log"></div>
<script src="https://unpkg.com/html5-qrcode"></script>
<script>
const API="https://juucegncscan.piecemane999.workers.dev";
let sent=0, last="", lastT=0;
const statusEl=document.getElementById('status');
const logEl=document.getElementById('log');
const countEl=document.getElementById('count');
function addLog(code){
  const d=document.createElement('div');d.className='row';
  d.innerHTML='<span>'+code+'</span><span class="n">#'+sent+'</span>';
  logEl.prepend(d);
}
async function send(code){
  code=(code||'').trim();
  if(!/^\d{6,14}$/.test(code)){statusEl.textContent='Ignored (not 6-14 digits): '+code;return;}
  const now=Date.now();
  if(code===last && now-lastT<2500){return;} // debounce same code
  last=code; lastT=now;
  try{
    await fetch(API+'/add',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({code})});
    sent++; countEl.textContent=sent+' sent'; statusEl.textContent='Sent '+code;
    addLog(code);
    if(navigator.vibrate)navigator.vibrate(40);
  }catch(e){statusEl.textContent='SEND FAILED - tunnel down? '+e;}
}
function manual(){const i=document.getElementById('mc');send(i.value);i.value='';}
function onScan(text){send(text);}
const h=new Html5Qrcode("reader");
h.start({facingMode:"environment"},{fps:10,qrbox:{width:250,height:160},
  formatsToSupport:[ Html5QrcodeSupportedFormats.UPC_A, Html5QrcodeSupportedFormats.UPC_E,
    Html5QrcodeSupportedFormats.EAN_13, Html5QrcodeSupportedFormats.EAN_8,
    Html5QrcodeSupportedFormats.CODE_128 ]},
  onScan, ()=>{}).catch(e=>{statusEl.textContent='Camera error: '+e+' — use manual entry below';});
</script></body></html>
